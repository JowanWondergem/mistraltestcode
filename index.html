<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature & Adventure Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Nature, Adventure & Extreme Sports</h1>
        <p>Daily changing gallery - Refresh every day for new images!</p>
    </header>
    
    <main>
        <div class="gallery-grid" id="gallery"></div>
        <div class="loading">Loading images...</div>
    </main>
    
    <footer>
        <p>Images provided by <a href="https://unsplash.com" target="_blank">Unsplash</a></p>
        <p>Last updated: <span id="last-updated"></span></p>
    </footer>
    
    <script src="app.js"></script>
</body>
</html>
